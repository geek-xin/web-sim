server:
  address: 127.0.0.1
  port: 8091

spring:
  application:
    name: web-sim
  main:
    web-application-type: reactive
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

web-sim:
  config-dir: config/simulations
  max-body-bytes: 1048576
  log-sample-rate: 0.01
  recent-log-size: 200
  tcp:
    default-host: 127.0.0.1
    max-frame-bytes: 65536
